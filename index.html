<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад уроків</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="schedule.png">

<style>
:root {
    --bg: #030303;
    --bg-soft: #080808;
    --card: rgba(255, 255, 255, 0.045);
    --card-strong: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.11);
    --border-strong: rgba(255, 255, 255, 0.22);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.48);
    --muted-2: rgba(255, 255, 255, 0.28);
    --black: #000000;
    --radius: 28px;
    --radius-sm: 18px;
    --shadow: 0 30px 100px rgba(0, 0, 0, 0.75);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    min-height: 100vh;
    margin: 0;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.10), transparent 24%),
        radial-gradient(circle at 80% 10%, rgba(255,255,255,0.07), transparent 28%),
        radial-gradient(circle at 50% 90%, rgba(255,255,255,0.05), transparent 35%),
        linear-gradient(135deg, #000 0%, #050505 45%, #111 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 70px 70px;
    mask-image: radial-gradient(circle at center, black 0%, transparent 75%);
    pointer-events: none;
    z-index: 0;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: url('https://grainy-gradients.vercel.app/noise.svg');
    opacity: 0.12;
    pointer-events: none;
    z-index: 2;
    filter: contrast(160%) brightness(100%);
}

.spotlight {
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle at var(--x, 50%) var(--y, 50%),
        rgba(255,255,255,0.12) 0%,
        rgba(255,255,255,0.035) 22%,
        transparent 48%
    );
    pointer-events: none;
    z-index: 1;
}

#login, #main {
    position: relative;
    z-index: 10;
    width: 100%;
}

#login {
    max-width: 460px;
    margin: 24px;
    padding: 48px 38px;
    text-align: center;
    background:
        linear-gradient(180deg, rgba(255,255,255,0.085), rgba(255,255,255,0.025)),
        rgba(255,255,255,0.025);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
}

#login::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: inherit;
    background: linear-gradient(145deg, rgba(255,255,255,0.55), transparent 30%, rgba(255,255,255,0.16));
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
}

.logo-mark {
    width: 74px;
    height: 74px;
    margin: 0 auto 26px;
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 24px;
}

h1 {
    margin: 0 0 14px;
    text-align: center;
    font-size: clamp(3rem, 9vw, 6.8rem);
    line-height: 0.88;
    font-weight: 900;
    letter-spacing: -0.08em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 0%, #d7d7d7 35%, #333333 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 30px 80px rgba(255,255,255,0.08);
}

h2 {
    margin: 0 0 10px;
    color: #fff;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: -0.06em;
    text-transform: uppercase;
}

.login-subtitle {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
}

.input-wrap {
    position: relative;
    margin-bottom: 18px;
}

input {
    width: 100%;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 18px;
    outline: none;
    background: rgba(255,255,255,0.045);
    color: #fff;
    font-size: 1rem;
    font-weight: 500;
    text-align: center;
    letter-spacing: 0.12em;
    transition: 0.3s ease;
}

input::placeholder { color: rgba(255,255,255,0.32); }

input:focus {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.55);
    box-shadow: 0 0 0 5px rgba(255,255,255,0.06);
}

button {
    width: 100%;
    padding: 18px 22px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    color: #000;
    background: linear-gradient(180deg, #ffffff, #bdbdbd);
    font-weight: 900;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 18px 36px rgba(255,255,255,0.14);
}

button:hover {
    transform: translateY(-4px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 24px 54px rgba(255,255,255,0.22);
}

button:active { transform: translateY(-1px) scale(0.99); }

#main {
    display: none;
    flex-direction: column;
    align-items: center; /* Центруємо весь вміст */
    opacity: 0;
    max-width: 1220px;
    margin: 0 auto;
    padding: 42px 22px 70px;
    transition: opacity 0.8s ease;
}

.top-panel {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 18px;
    align-items: center;
    margin-bottom: 28px;
    width: 100%;
    max-width: 950px;
}

.badge {
    justify-self: start;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255,255,255,0.035);
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
}

#timer {
    justify-self: center;
    padding: 13px 22px;
    min-width: 290px;
    text-align: center;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025));
    color: var(--muted);
    font-size: 0.86rem;
    font-weight: 500;
    box-shadow: 0 18px 45px rgba(0,0,0,0.35);
}

#timer b { color: #fff; font-weight: 900; }

.day-status {
    justify-self: end;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: #111;
    background: linear-gradient(180deg, #fff, #bfbfbf);
    font-size: 0.75rem;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
}

.container {
    width: 100%;
    max-width: 1000px;
    overflow-x: auto;
    padding: 4px;
    display: flex;
    justify-content: center; /* Центруємо таблицю всередині контейнера */
}

.container::-webkit-scrollbar { height: 10px; }
.container::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 999px; }
.container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 999px; }

table {
    width: 100%;
    min-width: 850px;
    border-collapse: separate;
    border-spacing: 12px;
}

th {
    padding: 14px 12px;
    color: var(--muted);
    font-size: 0.74rem;
    font-weight: 900;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    text-align: center;
}

td {
    position: relative;
    padding: 22px 14px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 22px;
    background:
        linear-gradient(180deg, rgba(255,255,255,0.065), rgba(255,255,255,0.025)),
        rgba(255,255,255,0.025);
    color: rgba(255,255,255,0.88);
    transition: 0.42s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
}

td::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top, rgba(255,255,255,0.18), transparent 55%);
    opacity: 0;
    transition: 0.35s ease;
    pointer-events: none;
}

.lesson {
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 650;
    letter-spacing: -0.015em;
}

.lesson:hover {
    transform: translateY(-8px) scale(1.025);
    background: linear-gradient(180deg, #ffffff, #cfcfcf);
    color: #000;
    border-color: rgba(255,255,255,0.7);
    box-shadow: 0 24px 55px rgba(255,255,255,0.16), inset 0 1px 0 rgba(255,255,255,0.95);
}

.lesson:hover::before { opacity: 1; }

.lesson-num {
    width: 72px;
    background: transparent;
    border-color: transparent;
    color: rgba(255,255,255,0.18);
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: -0.08em;
}

.today { color: #fff; }

.today-header {
    color: #fff;
    text-shadow: 0 0 24px rgba(255,255,255,0.35);
}

.today::after {
    content: "";
    position: absolute;
    inset: auto 18px 10px;
    height: 2px;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    opacity: 0.65;
}

.current-lesson {
    background: linear-gradient(180deg, #ffffff, #bdbdbd);
    color: #000;
    border-color: rgba(255,255,255,0.7);
    box-shadow: 0 18px 60px rgba(255,255,255,0.18), inset 0 1px 0 rgba(255,255,255,0.9);
}

.footer-note {
    margin-top: 18px;
    text-align: center;
    color: var(--muted-2);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
}

.shake { animation: shake 0.36s ease; }

@media (max-width: 820px) {
    body { align-items: flex-start; }
    #login { margin-top: 70px; padding: 42px 22px; }
    #main { padding: 30px 14px 50px; }
    .top-panel { grid-template-columns: 1fr; gap: 12px; }
    .badge, #timer, .day-status { justify-self: center; }
    h1 { margin-bottom: 20px; }
    table { border-spacing: 8px; min-width: 780px; }
    td { padding: 18px 10px; }
}

@media (max-width: 520px) {
    .logo-mark { width: 64px; height: 64px; }
    h2 { font-size: 1.65rem; }
    .login-subtitle { font-size: 0.68rem; }
    #timer { width: 100%; min-width: unset; }
}

/* Перемикач класів */
.class-switcher {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 0 auto 18px;
    flex-wrap: wrap;
}

.class-btn {
    width: auto;
    min-width: 150px;
    padding: 14px 24px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    background: rgba(255,255,255,0.045);
    box-shadow: none;
    letter-spacing: 0.08em;
}

.class-btn:hover {
    transform: translateY(-3px);
    color: #000;
}

.class-btn.active {
    color: #000;
    background: linear-gradient(180deg, #fff, #bdbdbd);
    border-color: rgba(255,255,255,0.7);
    box-shadow: 0 12px 35px rgba(255,255,255,0.12);
}

.schedule-title {
    text-align: center;
    margin: 4px 0 10px;
    color: #fff;
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
}

.lesson.empty {
    cursor: default;
    color: rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.018);
}

.lesson.empty:hover {
    transform: none;
    color: rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.018);
    border-color: var(--border);
    box-shadow: none;
}

@media (max-width: 520px) {
    .class-btn { min-width: 125px; padding: 12px 18px; }
    .schedule-title { font-size: 0.9rem; }
}

</style>
</head>

<body>

<div class="spotlight"></div>

<div id="login">
    <div class="logo-mark"><img src="schedule.png" alt="Логотип"></div>
    <h2>Система</h2>
    <p class="login-subtitle">Код доступу</p>
    <div class="input-wrap">
        <input type="password" id="pass" placeholder="Введи пароль">
    </div>
    <button onclick="login()">Увійти</button>
</div>

<div id="main">
    <h1>Розклад</h1>

    <div class="top-panel">
        <div></div>
        <div id="timer">Ініціалізація...</div>
        <div class="day-status" id="dayStatus">Сьогодні</div>
    </div>

    <div class="class-switcher">
        <button class="class-btn active" data-class="5" onclick="switchClass(5)">5 КЛАС</button>
        <button class="class-btn" data-class="8" onclick="switchClass(8)">8 КЛАС</button>
    </div>

    <div class="schedule-title" id="scheduleTitle">Розклад уроків 5 класу</div>

    <div class="container">
        <table id="scheduleTable">
            <thead>
                <tr>
                    <th>№</th>
                    <th data-day="1">ПН</th>
                    <th data-day="2">ВТ</th>
                    <th data-day="3">СР</th>
                    <th data-day="4">ЧТ</th>
                    <th data-day="5">ПТ</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <div class="footer-note">Обери клас • натисни на урок, щоб відкрити Zoom</div>
</div>

<script>
const spotlight = document.querySelector('.spotlight');

window.addEventListener('mousemove', e => {
    spotlight.style.setProperty('--x', `${e.clientX}px`);
    spotlight.style.setProperty('--y', `${e.clientY}px`);
});

const password = "5544332211";

const schedules = {
    5: {
        title: "Розклад уроків 5 класу",
        days: {
            1: ["Українська мова", "Математика", "Українська література", "Фізична культура", "Музичне мистецтво", "Інформатика", "Образотворче мистецтво (асинхронно)"],
            2: ["Англійська мова", "Українська мова", "Інформатика", "Математика", "Українська література", "Зарубіжна література", "Фізична культура"],
            3: ["Англійська мова", "Математика", "Здоров'я, безпека та добробут", "Технології", "Пізнаємо природу", "Історія", ""],
            4: ["Математика", "Пізнаємо природу", "Англійська мова", "Зарубіжна література", "Українська мова", "", ""],
            5: ["Українська мова", "Англійська мова", "Фізична культура", "Етика", "Історія", "Математика", ""]
        }
    },
    8: {
        title: "Розклад уроків 8 класу",
        days: {
            1: ["Технології", "Англ. мова", "Алгебра", "Хімія", "Зарубіжна література", "Фізкультура", "Фізика"],
            2: ["Англ. мова", "Алгебра", "Геометрія", "Укр. мова", "Хімія", "Інформатика", "Укр. літ"],
            3: ["Істор. Укр.", "Інформатика", "Фізика", "Географія", "Укр. мова", "Підприємництво та фін. грамотн.", "Всес. істор.", "Фізкультура"],
            4: ["Англ. мова", "Укр. мова", "Алгебра", "Укр. літ", "Біологія", "Здор. безпека і доброб.", "Істор. Укр."],
            5: ["Географія", "Біологія", "Зарубіжна література", "Геометрія", "Мистецтво", "Англ. мова", "Фізкультура"]
        }
    }
};

/* Створюємо правильне посилання Zoom із зашифрованим паролем */
function zoomURL(id, pass) {
    let cleanId = id.replace(/\s+/g, '');
    return `https://zoom.us/j/${cleanId}?pwd=${btoa(pass)}`;
}

/* Окремі бази посилань для кожного класу, щоб уникнути конфліктів при однакових предметах (наприклад, Інформатика) */
const classLinks = {
    5: {
        "Українська мова": zoomURL("539 732 7240", "2504"),
        "Українська література": zoomURL("539 732 7240", "2504"),
        "Етика": zoomURL("539 732 7240", "2504"),
        "Математика": zoomURL("862 8359 3232", "12345"),
        "Англійська мова": zoomURL("479 754 6112", "333"),
        "Інформатика": zoomURL("248 336 0743", "11111"), // Сичов І.Ю.
        "Здоров'я, безпека та добробут": zoomURL("784 586 93 08", "111"),
        "Фізична культура": zoomURL("719 6639 246", "123"),
        "Зарубіжна література": zoomURL("736 3167 8265", "0000"),
        "Пізнаємо природу": zoomURL("829 4214 8954", "666"),
        "Історія": zoomURL("818 066 5641", "1991"),
        "Технології": zoomURL("827 3794 5206", "111"),
        "Музичне мистецтво": zoomURL("513 785 6702", "111"),
        "Образотворче мистецтво (асинхронно)": ""
    },
    8: {
        "Здор. безпека і доброб.": zoomURL("784 586 93 08", "111"),
        "Біологія": zoomURL("784 586 93 08", "111"),
        "Зарубіжна література": zoomURL("736 3167 8265", "0000"),
        "Укр. літ": zoomURL("539 732 7240", "2504"),
        "Фізкультура": zoomURL("740 786 6981", "11223344"),
        "Фізра": zoomURL("740 786 6981", "11223344"), // те ж саме що й Фізкультура
        "Технології": zoomURL("827 3794 5206", "111"),
        "Англ. мова": zoomURL("729 9598 8336", "00000"), // Дьякова Л.В.
        "Фізика": zoomURL("865 7429 1592", "1111"),
        "Істор. Укр.": zoomURL("818 066 5641", "1991"),
        "Всес. істор.": zoomURL("818 066 5641", "1991"),
        "Алгебра": zoomURL("862 8359 3232", "12345"),
        "Геометрія": zoomURL("862 8359 3232", "12345"),
        "Укр. мова": zoomURL("539 732 7240", "2504"),
        "Географія": zoomURL("829 4214 8954", "666"),
        "Хімія": zoomURL("777 6583 1914", "666"),
        "Інформатика": zoomURL("603 110 6839", "222"), // Тимченко Т.П.
        "Підприємництво та фін. грамотн.": zoomURL("603 110 6839", "222"),
        "Мистецтво": zoomURL("736 3167 8265", "0000")
    }
};

let currentClass = 5;

function login() {
    const input = document.getElementById("pass");
    const loginBox = document.getElementById("login");

    if (input.value === password) {
        loginBox.style.display = "none";

        const main = document.getElementById("main");
        main.style.display = "flex"; // Використовуємо flex для відцентрування
        document.body.style.alignItems = "flex-start";

        setTimeout(() => main.style.opacity = "1", 50);

        renderSchedule(currentClass);
        timer();
        highlightToday();
        setInterval(timer, 1000);
    } else {
        input.value = "";
        input.placeholder = "Невірний код";
        loginBox.classList.remove("shake");
        void loginBox.offsetWidth;
        loginBox.classList.add("shake");
    }
}

document.getElementById("pass").addEventListener("keyup", e => {
    if (e.key === "Enter") login();
});

function switchClass(classNumber) {
    currentClass = classNumber;

    document.querySelectorAll(".class-btn").forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.class) === classNumber);
    });

    renderSchedule(classNumber);
    highlightToday();
    timer();
}

function renderSchedule(classNumber) {
    const schedule = schedules[classNumber];
    document.getElementById("scheduleTitle").textContent = schedule.title;

    const body = document.getElementById("scheduleBody");
    body.innerHTML = "";

    const maxLessons = Math.max(
        ...Object.values(schedule.days).map(day => day.length)
    );

    for (let lesson = 1; lesson <= maxLessons; lesson++) {
        const tr = document.createElement("tr");

        const num = document.createElement("td");
        num.className = "lesson-num";
        num.textContent = lesson;
        tr.appendChild(num);

        for (let day = 1; day <= 5; day++) {
            const td = document.createElement("td");
            const subject = schedule.days[day][lesson - 1] || "";

            if (subject) {
                td.className = "lesson";
                td.dataset.day = day;
                td.dataset.lesson = lesson;
                td.textContent = subject;
                td.onclick = () => openLesson(subject);
            } else {
                td.className = "lesson empty";
                td.dataset.day = day;
                td.dataset.lesson = lesson;
                td.textContent = "—";
            }

            tr.appendChild(td);
        }

        body.appendChild(tr);
    }
}

function openLesson(name) {
    // Беремо посилання залежно від вибраного зараз класу
    const url = classLinks[currentClass][name];

    if (url) {
        window.open(url, "_blank");
    } else if (url === "") {
        alert("Цей предмет («" + name + "») проходить в асинхронному режимі (без Zoom)");
    } else {
        alert("Упс, посилання для «" + name + "» ще не знайдено!");
    }
}

const times = [
    [8, 30, 9, 15],
    [9, 25, 10, 10],
    [10, 20, 11, 5],
    [11, 25, 12, 10],
    [12, 20, 13, 5],
    [13, 15, 14, 0],
    [14, 10, 14, 55],
    [15, 0, 15, 45]
];

function timer() {
    const now = new Date();
    const currentTotalSeconds =
        now.getHours() * 3600 +
        now.getMinutes() * 60 +
        now.getSeconds();

    const today = now.getDay();

    let nextLesson = null;
    let currentLesson = null;

    for (let i = 0; i < times.length; i++) {
        const t = times[i];
        const start = t[0] * 3600 + t[1] * 60;
        const end = t[2] * 3600 + t[3] * 60;

        if (currentTotalSeconds >= start && currentTotalSeconds <= end) {
            currentLesson = i + 1;
            break;
        }

        if (currentTotalSeconds < start && nextLesson === null) {
            nextLesson = start - currentTotalSeconds;
        }
    }

    document.querySelectorAll(".current-lesson")
        .forEach(el => el.classList.remove("current-lesson"));

    if (currentLesson && today >= 1 && today <= 5) {
        const active = document.querySelector(
            `.lesson[data-day="${today}"][data-lesson="${currentLesson}"]`
        );

        if (active && !active.classList.contains("empty")) {
            active.classList.add("current-lesson");
        }

        document.getElementById("timer").innerHTML =
            `ЗАРАЗ ІДЕ: <b>${currentLesson} УРОК</b>`;
        return;
    }

    if (nextLesson !== null) {
        const minutes = Math.floor(nextLesson / 60);
        const seconds = nextLesson % 60;

        document.getElementById("timer").innerHTML =
            `НАСТУПНИЙ УРОК ЧЕРЕЗ: <b>${minutes}хв ${seconds < 10 ? "0" + seconds : seconds}с</b>`;
    } else {
        document.getElementById("timer").innerText = "УРОКИ ЗАКІНЧЕНО 😎";
    }
}

function highlightToday() {
    const today = new Date().getDay();
    const dayStatus = document.getElementById("dayStatus");

    const names = {
        1: "Понеділок",
        2: "Вівторок",
        3: "Середа",
        4: "Четвер",
        5: "Пʼятниця"
    };

    document.querySelectorAll(".today, .today-header")
        .forEach(el => el.classList.remove("today", "today-header"));

    if (today >= 1 && today <= 5) {
        document.querySelectorAll(`[data-day="${today}"]`)
            .forEach(el => el.classList.add("today"));

        const header = document.querySelector(`th[data-day="${today}"]`);
        if (header) header.classList.add("today-header");

        dayStatus.innerText = names[today];
    } else {
        dayStatus.innerText = "Вихідний 🎉";
    }
}

renderSchedule(5);
